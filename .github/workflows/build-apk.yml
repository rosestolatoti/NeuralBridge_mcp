name: 🏗️ Build NeuralBridge APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Modo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  # Permite ações Node20 enquanto migramos para Node24 (remover depois)
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar SDK components
        run: |
          yes | sdkmanager --install "platforms;android-34"
          yes | sdkmanager --install "build-tools;34.0.0"
          yes | sdkmanager --install "ndk;27.0.12077973"
          yes | sdkmanager --install "cmake;3.22.1"
          echo "✅ SDK instalado"

      - name: 🔧 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build APK (${{ inputs.build_mode }})
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
          echo "✅ Build concluído"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuralBridge-APK-${{ inputs.build_mode }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
