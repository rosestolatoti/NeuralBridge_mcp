name: 🏗️ Build NeuralBridge APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Modo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        run: |
          # Baixa cmdline-tools manualmente (evita node20 deprecation de actions third-party)
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sSLo cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34"
          yes | sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0"
          yes | sdkmanager --sdk_root=$ANDROID_HOME "ndk;27.0.12077973"
          yes | sdkmanager --sdk_root=$ANDROID_HOME "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "✅ Android SDK instalado"

      - name: 🔧 Cache Gradle
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build APK (${{ inputs.build_mode }})
        run: |
          cd android
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_HOME
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
          echo "✅ Build concluído"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: NeuralBridge-APK-${{ inputs.build_mode }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
